# Minimal tag-driven release. Phase 2 of ROADMAP.md adds attestation, Open VSX,
# CHANGELOG release notes, a release environment and OIDC publishing.
name: Release

on:
    push:
        tags: ['v*']

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  # No dependency cache in the release job: a cache written by a
                  # CI run could otherwise poison the published VSIX.
                  package-manager-cache: false
            - name: Check tag matches package.json version
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
                      exit 1
                  fi
                  echo "VERSION=$version" >> "$GITHUB_ENV"
            - name: Install extension dependencies
              run: npm ci
            - name: Extension tests
              run: xvfb-run -a npm test
            # vscode:prepublish installs, unit-tests and builds the webview, then bundles the extension.
            - name: Package universal VSIX
              run: npx vsce package
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: vsix
                  path: grepc-${{ env.VERSION }}.vsix
                  if-no-files-found: error
            - name: Publish to Visual Studio Marketplace
              run: npx vsce publish --packagePath "grepc-$VERSION.vsix"
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
            - name: Create GitHub Release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  files: grepc-${{ env.VERSION }}.vsix
