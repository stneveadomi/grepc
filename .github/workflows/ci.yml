name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  # engines.node needs >=24.15.0, but `24` alone accepts any 24.x in the tool cache.
                  check-latest: true
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      webview-ui/grepc-webview/package-lock.json
            - name: Install extension dependencies
              run: npm ci
            - name: Install webview dependencies
              run: npm ci
              working-directory: webview-ui/grepc-webview
            - name: Prettier (extension)
              run: npm run prettier
            - name: Prettier (webview)
              run: npm run prettier:spa
            - name: ESLint (extension)
              run: npm run lint
            - name: ESLint (webview)
              run: npm run lint:spa

    test:
        name: test (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  # engines.node needs >=24.15.0, but `24` alone accepts any 24.x in the tool cache.
                  check-latest: true
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      webview-ui/grepc-webview/package-lock.json
            - name: Install extension dependencies
              run: npm ci
            - name: Install webview dependencies
              if: runner.os == 'Linux'
              run: npm ci
              working-directory: webview-ui/grepc-webview
            - name: Webview unit tests
              if: runner.os == 'Linux'
              run: npm run test:coverage
              working-directory: webview-ui/grepc-webview
            # @vscode/test-electron falls back to an installed VS Code under .vscode-test when its
            # version lookup fails, so a restored copy lets the tests run through that network flake.
            # Only the vscode-<platform>-<version> folders are cached (user-data would carry state
            # between runs). The per-run key saves any newer VS Code after each successful job.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .vscode-test/vscode-*
                  key: vscode-test-${{ runner.os }}-${{ github.run_id }}
                  restore-keys: vscode-test-${{ runner.os }}-
            - name: Extension tests (Linux)
              if: runner.os == 'Linux'
              run: xvfb-run -a npm test
            - name: Extension tests (Windows)
              if: runner.os == 'Windows'
              run: npm test
            # Keep only the newest VS Code so the saved cache does not grow with every release.
            - name: Prune cached VS Code builds
              shell: bash
              run: find .vscode-test -maxdepth 1 -type d -name 'vscode-*' | sort -V | head -n -1 | xargs -r rm -rf

    package:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  # engines.node needs >=24.15.0, but `24` alone accepts any 24.x in the tool cache.
                  check-latest: true
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      webview-ui/grepc-webview/package-lock.json
            - name: Install extension dependencies
              run: npm ci
            # vscode:prepublish installs and builds the webview, then bundles the extension.
            - name: Package universal VSIX
              run: npx vsce package
            - name: List VSIX contents
              run: npx vsce ls
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: vsix
                  path: '*.vsix'
                  if-no-files-found: error

    # Audits workflow files and dependabot.yml; findings go to the Security tab
    # (code scanning) rather than failing the job. To block merges on findings,
    # add code scanning merge protection to the main ruleset.
    zizmor:
        runs-on: ubuntu-latest
        permissions:
            # Upload SARIF to code scanning. In a public repo this is all the
            # action needs; a private repo would also need contents/actions: read.
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Run zizmor
              uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
