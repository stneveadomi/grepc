version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule: { interval: weekly }
      # GitHub Actions supports only default-days here, not the semver-*-days keys.
      cooldown: { default-days: 7 }
    - package-ecosystem: npm
      directories: ['/', '/webview-ui/grepc-webview']
      schedule: { interval: weekly }
      # Cooldown applies to version updates only; security updates are never delayed.
      cooldown: { default-days: 7, semver-major-days: 14 }
      # A dependency goes to the first group it matches, so order matters.
      groups:
          angular:
              patterns: ['@angular/*', 'angular-eslint', 'ngx-color-picker', 'zone.js']
          eslint:
              patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-config-prettier', 'globals']
          jest:
              patterns: ['jest', 'jest-*', '@types/jest', 'jsdom']
          vscode-tooling:
              patterns: ['@vscode/*', '@types/vscode']
          # Prettier is pinned exactly and a minor bump can reformat files, which fails
          # the format check. Its own group keeps that out of the dev-minor-patch PR.
          prettier:
              patterns: ['prettier']
          dev-minor-patch:
              dependency-type: development
              update-types: [minor, patch]
      ignore:
          # Angular majors are upgraded by hand with `ng update`, one major at a time.
          - dependency-name: '@angular/*'
            update-types: ['version-update:semver-major']
          # angular-eslint majors track Angular majors and move with `ng update angular-eslint`.
          - dependency-name: 'angular-eslint'
            update-types: ['version-update:semver-major']
          # jest-preset-angular majors each require a minimum Angular major.
          - dependency-name: 'jest-preset-angular'
            update-types: ['version-update:semver-major']
          # jest-environment-jsdom has its own jsdom range; a jsdom major would sit unused beside it.
          - dependency-name: 'jsdom'
            update-types: ['version-update:semver-major']
          # @angular/core peers on zone.js with a tilde range, so 0.x minors are breaking.
          - dependency-name: 'zone.js'
            update-types: ['version-update:semver-major', 'version-update:semver-minor']
          # Angular's compiler and typescript-eslint both cap the TypeScript minor.
          # TypeScript moves by hand, together with Angular.
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major', 'version-update:semver-minor']
          # @types/node tracks the Node runtime in use, not latest.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
          # @types/vscode must track engines.vscode, not latest.
          - dependency-name: '@types/vscode'
